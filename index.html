<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Pudú</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" id="favicon">
<script>
  // why: set the theme before first paint so a dark-mode user never sees a white flash.
  try { const t = JSON.parse(localStorage.getItem('pudu.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root{
  --bg:#F6F6F7; --surface:#FFFFFF; --surface-2:#F1F1F3; --ink:#18181B; --muted:#5F5F69; --faint:#6B6B75;
  --line:#E4E4E7; --line-2:#EFEFF1;
  --accent:#3E63DD; --accent-ink:#FFFFFF; --ok:#1F8A4C; --bad:#CD3B32; --warn:#A35F00; --merged:#7E4CC4;
  --hover:color-mix(in srgb,var(--ink) 3.5%,transparent);
  --sel:color-mix(in srgb,var(--accent) 8%,var(--surface));
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --cols:8px 22px minmax(0,1fr) 148px 70px 30px 24px 44px 40px 90px 66px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161618; --surface:#1C1C1F; --surface-2:#252529; --ink:#EDEDEF; --muted:#A1A1AA; --faint:#909099;
    --line:#2D2D32; --line-2:#252529;
    --accent:#7B9BFF; --accent-ink:#0E1430; --ok:#46C37B; --bad:#F0716A; --warn:#E5A640; --merged:#B794F4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161618; --surface:#1C1C1F; --surface-2:#252529; --ink:#EDEDEF; --muted:#A1A1AA; --faint:#909099;
  --line:#2D2D32; --line-2:#252529;
  --accent:#7B9BFF; --accent-ink:#0E1430; --ok:#46C37B; --bad:#F0716A; --warn:#E5A640; --merged:#B794F4;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.4 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
.i{width:16px;height:16px;flex:none}
kbd{font:600 11px/1 var(--mono);padding:2px 5px;border-radius:4px;border:1px solid var(--line);border-bottom-width:2px;background:var(--surface);color:var(--muted)}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;height:48px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;flex:none;width:224px;font-weight:650;font-size:15px}
.brand img{width:24px;height:24px;border-radius:6px}
.loading .brand img{animation:spin 1.2s linear infinite}
.search{position:relative;flex:1;max-width:460px}
.search .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;width:14px;height:14px}
.search input{width:100%;height:30px;padding:0 36px 0 30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--accent)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.search input:focus + kbd,.search input:not(:placeholder-shown) + kbd{display:none}
.tools{display:flex;align-items:center;gap:2px;margin-left:auto}
.ib.lang{font:600 11px/1 var(--font);letter-spacing:.04em}
.ib{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib[aria-pressed="true"]{color:var(--accent)}
.loading #refresh .i{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:550;color:var(--muted);white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--faint)}
.btn .i{width:14px;height:14px}
.me{display:block;width:26px;height:26px;border-radius:50%;background:var(--surface-2)}
.me-ini{display:none;width:26px;height:26px;border-radius:50%;place-items:center;background:var(--surface-2);font:650 11px/1 var(--font);color:var(--muted);text-transform:uppercase}
.me:not([src]) + .me-ini:not(:empty){display:grid}
.acct{margin-left:6px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer}
.acct:disabled{cursor:default}
.acct:not(:disabled):hover :is(.me,.me-ini){box-shadow:0 0 0 2px var(--line)}
#accts{width:280px}
#accts .pop-note{padding:4px 8px 6px}
#acct-list button{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 8px;border:0;border-radius:6px;background:none;cursor:pointer;text-align:left}
#acct-list button:is(:hover,:focus-visible){background:var(--hover)}
#acct-list .ck{display:grid;width:16px;color:var(--accent)}
#acct-list span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#acct-list b{font-weight:400;color:var(--faint)}
.me:not([src]){display:none}

/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);gap:16px;padding:12px 16px 32px}
.side{position:sticky;top:60px;align-self:start}
.nav{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.nav a{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:7px;text-decoration:none;color:var(--muted)}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a span{flex:1}
/* why: every count sits in the same centered box, so a filled badge lines up with the plain numbers. */
.nav a b{min-width:22px;padding:2px 6px;border-radius:999px;text-align:center;font-weight:550;font-size:12px;font-variant-numeric:tabular-nums;color:var(--faint)}
.nav a.hot{color:var(--ink)}
.nav a.hot b{background:var(--accent);color:var(--accent-ink)}
.nav .gap{height:1px;margin:6px 10px;background:var(--line)}

/* repo picker + banner */
.pop{position:fixed;inset:52px 16px auto auto;margin:0;width:320px;max-width:calc(100vw - 32px);max-height:min(70vh,560px);overflow:auto;padding:6px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);box-shadow:0 20px 50px -12px rgba(0,0,0,.4)}
.pop-h{display:flex;align-items:center;gap:4px;padding:2px 2px 4px}
.pop-h input{flex:1;min-width:0;height:28px;margin-right:4px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.pop-h input:focus{outline:none;border-color:var(--accent)}
.pop-h button{height:26px;padding:0 8px;border:0;border-radius:6px;background:none;color:var(--accent);cursor:pointer;font-size:12px;font-weight:550;white-space:nowrap}
.pop-h button:hover{background:var(--hover)}
.pop-h button:first-of-type{margin-left:auto}
.pop-note{margin:0;padding:0 8px 6px;font-size:12px;color:var(--faint)}
.owner summary{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;list-style:none;font-weight:600;font-size:12.5px}
.owner summary::-webkit-details-marker{display:none}
.owner summary:hover{background:var(--hover)}
.owner summary input{accent-color:var(--accent);margin:0}
.owner summary span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owner summary b{font-weight:500;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.owner[open] .chev{transform:rotate(90deg)}
.owner .repo-opt{padding-left:30px}
.repo-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer}
.repo-opt:hover{background:var(--hover)}
.repo-opt input{accent-color:var(--accent);margin:0}
.repo-opt span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo-opt b{font-weight:500;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
#repos-btn[data-filtered]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.banner{display:flex;gap:8px;align-items:flex-start;margin:0 0 10px;padding:8px 12px;border-radius:8px;font-size:13px;
  background:color-mix(in srgb,var(--warn) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner .i{color:var(--warn)}
.banner code{font:12px var(--mono);word-break:break-word}
.banner details{display:inline}
.banner summary{display:inline;cursor:pointer;color:var(--muted)}
.banner details[open] code{display:block;margin-top:4px}
.es{max-width:560px;margin:40px auto;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.es img{display:block;border-radius:8px}
.es h2{margin:14px 0 6px;font-size:18px;font-weight:650}
.es p{margin:0 0 14px;color:var(--muted)}
.es p code{font:12.5px var(--mono);color:var(--ink)}
.es a{color:var(--accent)}
.cmd{display:flex;align-items:center;gap:10px;margin:0 0 8px;padding:3px 3px 3px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.cmd span{min-width:96px;color:var(--muted);font-size:12px}
.cmd code{flex:1;font:13px var(--mono);white-space:nowrap;overflow-x:auto}
.es details{margin:0 0 14px}
.es summary{cursor:pointer;color:var(--muted)}
.es pre{margin:8px 0 0;padding:10px;max-height:220px;overflow:auto;border-radius:8px;background:var(--surface-2);font:12px var(--mono);white-space:pre-wrap;word-break:break-word}

/* sections */
.sec{margin:0 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:8px;height:42px;padding:0 10px 0 12px;list-style:none;cursor:pointer;user-select:none}
.sec-h::-webkit-details-marker{display:none}
.sec-h h2{margin:0;font-size:14px;font-weight:600}
.sec-h .n{color:var(--faint);font-variant-numeric:tabular-nums}
.sec-h .hint{color:var(--muted);font-size:12px;margin-left:4px;text-decoration-color:var(--faint);text-underline-offset:3px}
.sec-h .btn{margin-left:auto}
@media (hover:hover){
  .sec-h .btn{opacity:0;transition:opacity .12s}
  .sec-h:is(:hover,:focus-within) .btn{opacity:1}
}
.empties{margin:4px 2px 10px;color:var(--muted);font-size:13px}
.empties span[id]{scroll-margin-top:60px}
.chev{color:var(--faint);transition:transform .15s;width:14px;height:14px}
details.sec[open] .chev{transform:rotate(90deg)}
div.sec .sec-h{cursor:default}
.sec-err{display:flex;align-items:center;gap:6px;margin:0;padding:8px 14px;border-top:1px solid var(--line);color:var(--warn);font-size:12.5px}
.sec-err span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* table */
.row{display:grid;grid-template-columns:var(--cols);gap:8px;align-items:center;padding:0 14px 0 10px}
.cols{height:30px;border-top:1px solid var(--line);color:var(--faint);font-size:12px}
.cols .i{width:14px;height:14px}
.cols .r{text-align:right}
.cols :is(.c-ci,.c-dec,.c-mrg,.c-people,.c-thr){text-align:center}
.pr{position:relative;min-height:48px;border-top:1px solid var(--line-2);scroll-margin:60px 0 16px}
.pr:hover{background-color:var(--hover)}
.pr.sel{background-color:var(--sel);box-shadow:inset 2px 0 0 var(--accent)}
.pr:has(.t:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.z{position:relative;z-index:1}
.new{display:block;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.new.upd{background:none;box-shadow:inset 0 0 0 1.5px var(--accent)}
/* why: a stack reads as one straight rail through the dot column; up joins the row above, down the row below. */
.pr:is(.up,.down){--rail:linear-gradient(color-mix(in srgb,var(--faint) 60%,transparent),color-mix(in srgb,var(--faint) 60%,transparent));background-image:var(--rail);background-repeat:no-repeat;background-position:12px 0;background-size:2px 100%}
.pr.up:not(.down){background-size:2px 50%}
.pr.down:not(.up){background-position:12px 100%;background-size:2px 50%}
.av{position:relative;flex:none;width:22px;height:22px}
.av img,.av .ini{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);object-fit:cover}
.av .ini{font:650 10px/1 var(--font);color:var(--muted);text-transform:uppercase}
.body{min-width:0;padding:6px 0}
.t{display:block;font-weight:500;font-size:14px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t:focus-visible{outline:none}
.t::after{content:"";position:absolute;inset:0}
.t:hover{text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.meta{display:flex;align-items:center;gap:6px;margin-top:1px;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden}
.meta .sep{color:var(--faint)}
.meta .num{flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .repo{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;font-size:11.5px;background:var(--surface-2);color:var(--muted);flex:none}
.tag .i{width:12px;height:12px}
.tag code{font:11px var(--mono);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.lbl i{width:7px;height:7px;border-radius:50%;background:var(--lc,var(--faint))}
.people{display:flex;justify-content:center;padding-left:6px}
.people .av{margin-left:-6px}
.people .av img,.people .av .ini{border:2px solid var(--surface)}
.pr:hover .people .av img,.pr:hover .people .av .ini{border-color:color-mix(in srgb,var(--ink) 3.5%,var(--surface))}
.pr.sel .people .av img,.pr.sel .people .av .ini{border-color:var(--sel)}
.av.team .ini{border-radius:6px}
.av.pend img,.av.pend .ini{opacity:.5}
.av s{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--surface);border:1.5px solid var(--surface);text-decoration:none}
.av s .i{width:7px;height:7px;stroke-width:4}
.more{font-size:11px;color:var(--faint);margin-left:4px;align-self:center}
.c-thr{display:flex;justify-content:center}
.thr{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thr .i{width:13px;height:13px}
/* why: secondary glyphs stay unfilled so the one filled pill per row carries the verdict. */
.st{display:grid;place-items:center;height:24px;color:var(--c);text-decoration:none}
.st .i{width:16px;height:16px}
.pill{position:relative;display:inline-flex;align-items:center;gap:6px;max-width:100%;height:22px;padding:0 9px 0 8px;border-radius:999px;font-size:12px;font-weight:550;white-space:nowrap;
  color:color-mix(in srgb,var(--c) 78%,var(--ink));background:color-mix(in srgb,var(--c) 13%,transparent)}
.pill::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--c)}
.pill b{min-width:0;font-weight:inherit;overflow:hidden;text-overflow:ellipsis}
.size{display:grid;grid-template-columns:1fr 40px;gap:4px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.add{color:var(--ok)}.del{color:var(--bad)}.size .zero{color:var(--faint)}
[data-tip]:is(:hover,:focus-visible){z-index:3}
[data-tip]:is(:hover,:focus-visible)::after{content:attr(data-tip);position:absolute;right:0;bottom:calc(100% + 6px);width:max-content;max-width:300px;padding:5px 8px;border-radius:6px;
  background:var(--ink);color:var(--bg);font:500 12px/1.35 var(--font);text-align:left;white-space:normal;pointer-events:none}
.c-pill [data-tip]::after{right:auto;left:0}
.when{text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.when.w1{color:var(--warn)}.when.w2{color:var(--bad);font-weight:600}
.acts{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:2;display:flex;gap:2px;padding:2px;border-radius:8px;border:1px solid var(--line);background:var(--surface);box-shadow:0 4px 12px -6px rgba(0,0,0,.3);opacity:0;pointer-events:none}
.acts .ib{width:26px;height:26px}
.acts .ib .i{width:15px;height:15px}
.pr:hover .acts,.acts:focus-within{opacity:1;pointer-events:auto}
@media (hover:none){.pr.sel .acts{opacity:1;pointer-events:auto}}
.sk{height:48px;border-top:1px solid var(--line-2);background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface));background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* footer, dialog, toast */
.foot{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:12px 16px 24px;color:var(--faint);font-size:12px;border-top:1px solid var(--line)}
.foot .warn-t{color:var(--warn)}
.foot code{font:11.5px var(--mono)}
.foot button{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);margin-left:auto;font-size:12px}
.foot button:hover{color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px 22px;width:min(440px,calc(100vw - 32px));box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
dialog h2 img{width:22px;height:22px;border-radius:6px}
dialog dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;align-items:center}
dialog dt{display:flex;gap:4px;justify-content:flex-end}
dialog dd{margin:0;color:var(--muted)}
dialog form{margin-top:16px;text-align:right}
#snooze{width:min(320px,calc(100vw - 32px));padding:10px}
#snooze h2{margin:2px 8px 8px;font-size:14px;font-weight:600}
.opt{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 8px;border:0;border-radius:7px;background:none;cursor:pointer;text-align:left}
.opt:is(:hover,:focus-visible){background:var(--hover)}
.opt span{flex:1}
.opt b{font-weight:450;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
dialog form.snz-custom{display:flex;gap:6px;margin:6px 0 0;padding:10px 0 0;border-top:1px solid var(--line)}
.snz-custom input{flex:1;min-width:0;height:28px;padding:0 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:12.5px}
.snz-custom input:focus{outline:none;border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:13px;transition:.2s ease;z-index:60;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast code{font:12px var(--mono)}

/* responsive: secondary columns drop first; the pill and the age always stay */
@media (max-width:1280px){
  :root{--cols:8px 22px minmax(0,1fr) 148px 24px 44px 40px 90px 66px}
  .c-people,.c-thr{display:none!important}
}
@media (max-width:1100px){
  :root{--cols:8px 22px minmax(0,1fr) 148px 90px 66px}
  .c-ci,.c-dec,.c-mrg{display:none!important}
}
@media (max-width:1000px){
  .top{gap:10px}
  .brand{width:auto}.brand span{display:none}
  .shell{grid-template-columns:minmax(0,1fr);padding:8px 10px 24px}
  .side{position:static;overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
  .nav{display:flex;width:max-content;padding-right:32px}
  .nav .gap{display:none}
}
@media (max-width:800px){
  :root{--cols:8px 22px minmax(0,1fr) 140px 66px}
  .c-size{display:none!important}
  .search kbd,#copy-all span,#repos-btn span{display:none}
}
@media (max-width:640px){
  .cols,.c-av{display:none!important}
  .pr{grid-template-columns:8px minmax(0,1fr) auto auto;grid-template-areas:"new t t time" "new meta pill pill";row-gap:3px;padding-block:8px}
  .pr .meta .lbl{display:none}
  .pr .body{display:contents}
  .pr .c-new{grid-area:new;align-self:start;margin-top:7px}
  .pr .t{grid-area:t}
  .pr .meta{grid-area:meta;margin:0}
  .pr .c-pill{grid-area:pill;justify-self:end;max-width:170px}
  .pr .c-time{grid-area:time}
}
@media (max-width:500px){
  .top{flex-wrap:wrap;height:auto;padding-block:8px;row-gap:8px}
  .search{order:9;flex-basis:100%;max-width:none}
  /* why: phones have no keyboard to use shortcuts with, and the language button needs the room. */
  #help-btn{display:none}
  html{scroll-padding-top:100px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* time */
function ago(iso) {
  const ms = Date.parse(iso);
  if (!ms) return '';
  const s = (ms - Date.now()) / 1000, a = Math.abs(s);
  if (a < 45) return t('justNow');
  if (a < 3600) return rtf.format(Math.round(s / 60), 'minute');
  if (a < 86400) return rtf.format(Math.round(s / 3600), 'hour');
  return rtf.format(Math.round(s / 86400), 'day');
}
function short(iso) {
  const m = (Date.now() - Date.parse(iso)) / 6e4, h = m / 60;
  if (!(m >= 0)) return '';
  if (m < 1) return t('now');
  if (m < 60) return dur(m, 'minute');
  if (h < 24) return dur(h, 'hour');
  if (h < 24 * 30) return dur(h / 24, 'day');
  if (h < 24 * 365) return dur(h / 24 / 30, 'month', 'long');
  return dur(h / 24 / 365, 'year', 'long');
}
// why: Spanish short months render "3 m.", which reads as minutes; spell out the long units.
const dur = (n, unit, unitDisplay = 'short') => new Intl.NumberFormat(LANG, {style: 'unit', unit, unitDisplay}).format(Math.floor(n));
function untilText(ms) {
  const days = Math.round((new Date(ms).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0)) / 864e5), hm = {hour: '2-digit', minute: '2-digit', hourCycle: 'h23'};
  if (days === 0) return hhmm(ms);
  if (days === 1) return `${rtf.format(1, 'day')} ${hhmm(ms)}`;
  return new Date(ms).toLocaleString(LANG, days > 0 && days < 7 ? {weekday: 'short', ...hm} : {day: 'numeric', month: 'short', ...hm});
}
const fullDate = iso => { const ms = Date.parse(iso); return ms ? new Date(ms).toLocaleString(LANG, {dateStyle: 'medium', timeStyle: 'short'}) : ''; };

/* cells */
function avatar(login, src, {cls = '', state, title} = {}) {

  const badge = state ? `<s style="--c:var(${state[1]})">${ico(state[0])}</s>` : '';

}
const REVIEW_STATE = {

  COMMENTED: ['comment', '--muted', 'r_COMMENTED'],
  DISMISSED: ['x', '--faint', 'r_DISMISSED'],
};
function people(p) {

  const pend = arr(p.pending).filter(r => r && r.login && !seen.has(r.login));
  const all = [
    ...done.map(r => { const st = REVIEW_STATE[r.state] || REVIEW_STATE.COMMENTED; return avatar(r.login, r.avatar, {state: st, title: t(st[2], r.login)}); }),
    ...pend.map(r => avatar(r.login, r.avatar, {cls: 'pend', title: r.login === S.data?.login ? t('pendYou') : t('pendOf', r.login.replace(/^team:/, ''))})),
  ];
  const extra = all.length > 3 ? `<span class="more">+${all.length - 3}</span>` : '';
  return `<span class="people c-people z">${all.slice(0, 3).join('')}${extra}</span>`;
}

}
const status = (cls, [icon, color, tip], href = '') => {

};
const CI = {
  SUCCESS: ['ciOk', '--ok'], FAILURE: ['ciBad', '--bad'], ERROR: ['ciBad', '--bad'], PENDING: ['clock', '--warn'], EXPECTED: ['clock', '--warn'],

function ci(p) {

  const failed = arr(p.failedChecks).filter(Boolean), tip = t('ci_' + p.checks);
  return status('c-ci', [...c, failed.length ? `${tip}: ${failed.join(', ')}` : tip], safeUrl(p.url) ? `${safeUrl(p.url)}/checks` : '');

const isRed = p => p.checks === 'FAILURE' || p.checks === 'ERROR';
const isConflict = p => p.conflict || p.mergeState === 'DIRTY';

function mergeable(p, sec) {

/* prompt for a coding agent */
const problems = p => [

  isConflict(p) && t('conflictWith', p.baseRef),
  decisionOf(p) === 'CHANGES_REQUESTED' && t('changesReq'),
  Number(p.unresolvedThreads) > 0 && t('openThreads', Number(p.unresolvedThreads)),
  p.mergeState === 'BEHIND' && t('behindOf', p.baseRef),

function matches(p) {
  if (!S.q) return true;
  const hay = norm([p.title, p.repo, p.author, '#' + p.number, p.number, p.headRef, p.baseRef, ...arr(p.labels).map(l => l?.name)].join(' '));
  return norm(S.q).split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}

/* render */
function render() {
  const d = S.data;
  const filtering = !!S.q;

  const empty = [], hinted = new Set();
  const secs = sectionsOf(d);
  let html = secs.map(sec => {
    const all = arr(sec.get(d)).filter(Boolean), prs = all.filter(matches);
    S.visible[sec.id] = {prs, total: all.length};
    if (!prs.length && !sec.error) { if (sec !== SNOOZED) empty.push(`<span id="sec-${esc(sec.id)}">${esc(sec.title)}</span>`); return ''; }
    const n = filtering && all.length !== prs.length ? t('of', prs.length, all.length) : `${prs.length}`;
    // why: one search feeds several sections; say it was cut short once, on the first of them.
    const total = Number(d.truncated?.[sec.search]);
    let hint = '';
    if (total && !hinted.has(sec.search)) {
      hinted.add(sec.search);
      const shown = SECTIONS.filter(s => s.search === sec.search).reduce((a, s) => a + arr(s.get(d)).length, 0);
      hint = `<a class="hint z" href="${searchUrl(sec.search)}" target="_blank" rel="noopener" data-tip="${esc(t('truncTip'))}">${esc(t('of', num.format(shown), num.format(total)))}</a>`;
    }
    const head = `${ico('chev', 'chev')}<h2 id="h-${esc(sec.id)}">${esc(sec.title)}</h2><span class="n">${n}</span>${hint}`
      + `<button class="btn" type="button" data-copy-sec="${esc(sec.id)}" title="${t('copySecTip')}">${ico('copy')}${t('copy')}</button>`;
    const err = sec.error ? `<p class="sec-err">${ico('alert')}<span title="${esc(sec.error)}">${esc(sec.error)}</span></p>` : '';
    return `<details class="sec" id="sec-${esc(sec.id)}" data-sec="${esc(sec.id)}"${sec.collapsed ? ' data-collapsed' : ''} ${isClosed(sec) ? '' : 'open'}><summary class="sec-h">${head}</summary>`
      + err + (prs.length ? colsHead(sec) + stackOrder(prs).map(([p, depth], i, all) => row(p, sec, depth, (all[i + 1]?.[1] || 0) > 0)).join('') : '') + '</details>';
  }).join('');
  if (empty.length) html += `<p class="empties">${t(filtering ? 'noMatchIn' : 'nothingIn')} ${empty.join('<span aria-hidden="true"> · </span>')}</p>`;

  const fa = document.activeElement, hadFocus = fa?.closest?.('.pr');
  const refocus = !hadFocus && fa?.closest?.('#app') && (fa.dataset.copySec ? `[data-copy-sec="${CSS.escape(fa.dataset.copySec)}"]`
    : fa.matches('summary') && fa.parentElement.id ? `#${CSS.escape(fa.parentElement.id)} > summary` : null);
  const app = $('#app');
  app.innerHTML = html;
  delete app.dataset.empty;
  app.setAttribute('aria-busy', 'false');
  if (hadFocus && S.sel) $(`.pr[data-id="${CSS.escape(S.sel)}"] .t`)?.focus({preventScroll: true});
  else if (refocus) $(refocus)?.focus({preventScroll: true});

  $('#nav').innerHTML = secs.map(sec => {
    const n = S.visible[sec.id].prs.length;
    if (sec === SNOOZED && !n) return '';
    return `${sec.gapBefore ? '<li class="gap" aria-hidden="true"></li>' : ''}<li><a href="#sec-${esc(sec.id)}" class="${n && sec.urgent ? 'hot' : ''}" data-sec="${esc(sec.id)}"><span>${esc(sec.title)}</span><b>${n}</b></a></li>`;
  }).join('');

  renderRepos();

  renderChrome();
  tick();
}

function filterRepos() {

// why: one POST at a time and only the newest choice is applied, so fast clicking can't land out of order.
async function flushHidden() {
  if (hideBusy) { hideAgain = true; return; }
  hideBusy = true;
  const want = S.hiddenWant;
  try {
    const d = await save('/api/hidden', {hidden: [...want]});
    if (S.hiddenWant === want) { S.hiddenWant = null; if (!apply(d)) render(); }
  } catch (e) {
    toast(`${t('saveReposFail')} <code>${esc(e.message)}</code>`);
    if (S.hiddenWant === want) { S.hiddenWant = null; render(); }
  } finally {
    hideBusy = false;
    if (hideAgain) { hideAgain = false; flushHidden(); }
  }
}

/* live bits */
function tick() {
  const stale = (Number(S.data?.settings?.staleHours) || 24) * 36e5;
  for (const el of document.querySelectorAll('[data-t]')) {
    const age = Date.now() - Date.parse(el.dataset.t), lvl = !el.dataset.urgent ? 0 : age > 3 * stale ? 2 : age > stale ? 1 : 0;
    el.textContent = short(el.dataset.t);
    el.className = `when c-time z${lvl ? ' w' + lvl : ''}`;
  }
  if (S.data?.fetchedAt) {
    const iso = new Date(S.data.fetchedAt * 1000).toISOString();
    $('#fresh').textContent = t('fetched', ago(iso));
    $('#fresh').title = fullDate(iso);
  }
}

function setFavicon(n) {

/* data */
function notifyNew(prev, next) {
  if (!prev || !bellOn()) return;
  const fire = (title, p, why = '') => {
    try {
      const n = new Notification(title, {body: `${why ? why + '\n' : ''}${repoName(p)}#${p.number}  ${p.title || ''}`, icon: '/favicon.svg', tag: keyOf(p)});
      n.onclick = () => { if (safeUrl(p.url)) window.open(p.url, '_blank', 'noopener'); n.close(); };
    } catch {}
  };
  for (const id of ['review', 'approved']) {
    const get = SECTIONS.find(s => s.id === id).get, before = new Set(arr(get(prev)).map(keyOf));
    for (const p of arr(get(next))) if (!before.has(keyOf(p))) fire(t(p.rereview ? 'n_rereview' : 'n_' + id), p);
  }
  // why: your own PRs notify when they newly break, not whenever they move between sections.
  const mine = d => SECTIONS.filter(s => s.mine && !s.calm).flatMap(s => arr(s.get(d)));
  const before = new Map(mine(prev).map(p => [keyOf(p), p]));
  for (const p of mine(next)) {
    const o = before.get(keyOf(p)), failed = arr(p.failedChecks).filter(Boolean);
    if (!o) continue;
    const why = [
      isRed(p) && !isRed(o) && (failed.length ? t('ciFailedOn', failed.join(', ')) : t('ci_' + p.checks)),
      isConflict(p) && !isConflict(o) && t('conflictWith', p.baseRef),
      decisionOf(p) === 'CHANGES_REQUESTED' && decisionOf(o) !== 'CHANGES_REQUESTED' && t('changesReq'),
      Number(p.unresolvedThreads) > (Number(o.unresolvedThreads) || 0) && t('openThreads', Number(p.unresolvedThreads)),
    ].filter(Boolean);
    if (why.length) fire(t('n_returned'), p, why.join(' · '));
  }
}
function syncSeen(d) {
  const keys = sectionsOf(d).flatMap(s => arr(s.get(d))).filter(Boolean).map(keyOf);
  if (!S.seenSeeded) { keys.forEach(k => S.seen.add(k)); S.seenSeeded = true; }
  // why: a snapshot flagged with error may be partial; pruning against it would re-mark PRs as new.
  // why: a hidden repo's PRs are absent, not gone; keep them seen so unhiding doesn't flag them as new.
  else if (!d.error) {
    const hidden = new Set(arr(d.repos).filter(r => r.hidden).map(r => r.repo)), live = new Set(keys);
    const keep = k => live.has(k) || hidden.has(k.slice(0, k.lastIndexOf('#')));
    S.seen = new Set([...S.seen].filter(keep));
    S.opened = Object.fromEntries(Object.entries(S.opened).filter(([k]) => keep(k)));
    store.set('opened', S.opened);
  }
  store.set('seen', [...S.seen]);
}
// why: a proxy or a crashed server answers HTML; a raw JSON.parse error means nothing to the reader.
async function readJson(r) {
  const text = await r.text();
  const fail = msg => Object.assign(new Error(msg), {raw: text.slice(0, 2000) || msg});
  if (!r.ok) throw fail(`HTTP ${r.status}`);
  try { return JSON.parse(text); } catch { throw fail(t('badReply')); }
}
function apply(d) {
  S.netError = null; S.netRaw = '';
  const kind = T.en['b_' + d?.errorKind] ? d.errorKind : 'other';
  S.err = d?.error ? {kind, msg: d.error, resetAt: d.rateLimit?.resetAt} : null;
  if (!d?.login) { if (S.data) renderChrome(); else renderNoData(); return false; }
  syncSeen(d);
  S.data = d;
  S.cached = false;
  store.set('snap', d);
  render();
  return true;
}
let saveChain = Promise.resolve();
// why: one POST at a time, in order; each answers with the full data, which outranks any poll already in flight.
function save(path, body) {
  const run = async () => {
    const d = await readJson(await fetch(`${path}?lang=${LANG}`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)}));
    S.gen++;
    return d;
  };
  return saveChain = saveChain.then(run, run);
}
const sameAcct = (a, b) => a?.host === b?.host && a?.user === b?.user;
async function load(force = false) {
  if (S.loading) return;
  S.loading = true;
  document.body.classList.add('loading');
  clearTimeout(S.retryTimer);
  const gen = S.gen;
  try {
    const d = await readJson(await fetch(`/api/data?lang=${LANG}${force ? '&force=1' : ''}`, {cache: 'no-store'}));
    // why: a save answered while this poll was in flight; its older snapshot would undo the save on screen.
    if (gen !== S.gen) return;
    // why: a snapshot from the last visit is not a previous poll; diffing against it would notify on every F5.
    // why: another account's PRs are not "new" (a switch made in another tab lands here); seed them as seen.
    if (S.data && d?.login && !sameAcct(S.data.account, d.account)) S.seenSeeded = false;
    else if (S.data && d?.login && !S.cached && S.data.fetchedAt !== d.fetchedAt) notifyNew(S.data, d);
    if (!apply(d)) { S.retryTimer = setTimeout(load, 5000); return; }
    if (force) toast(t('upToDate'));
  } catch (e) {
    S.netError = e.message || t('netErr');
    S.netRaw = e.raw || '';
    if (S.data) renderChrome(); else renderNoData();
  } finally {
    S.loading = false;
    S.lastLoad = Date.now();
    document.body.classList.remove('loading');
  }
}

function markSeen(rowEl) {
  const k = rowEl?.dataset.key;
  if (!k) return;
  S.seen.add(k);
  S.opened[k] = Date.now();
  store.set('seen', [...S.seen]);
  store.set('opened', S.opened);
  rowEl.querySelector('.new')?.remove();
}
function prOf(rowEl) {
  const [sid, k] = rowEl.dataset.id.split('|');
  return S.visible[sid]?.prs.find(p => keyOf(p) === k);

/* account */
async function switchAccount(host, user) {
  $('#accts').hidePopover();
  const who = `${user}@${host}`, cur = S.data?.account;
  if (cur && cur.host === host && cur.user === user) return;
  document.body.classList.add('loading');
  $('#app').setAttribute('aria-busy', 'true');
  toast(t('switching', esc(who)));
  try {
    const d = await save('/api/account', {host, user});
    // why: another account's PRs are not "new"; seed them as seen like a first visit.
    S.seenSeeded = false;
    if (apply(d)) toast(t('switched', esc(who)));
  } catch (e) { toast(`${t('switchFail')} <code>${esc(e.message)}</code>`); }
  finally {
    if (!S.loading) document.body.classList.remove('loading');
    $('#app').setAttribute('aria-busy', 'false');
  }
}
$('#acct-list').addEventListener('click', e => { const b = e.target.closest('[data-host]'); if (b) switchAccount(b.dataset.host, b.dataset.user); });
$('#accts').addEventListener('toggle', e => { if (e.newState === 'open') ($('#acct-list [aria-pressed="false"]') || $('#acct-list button'))?.focus(); });

/* snooze */
const at9 = days => { const d = new Date(); d.setDate(d.getDate() + days); d.setHours(9, 0, 0, 0); return d.getTime(); };
const SNOOZE_OPTS = {'1h': () => Date.now() + 36e5, '3h': () => Date.now() + 3 * 36e5, tomorrow: () => at9(1), monday: () => at9((8 - new Date().getDay()) % 7 || 7)};
const localInput = ms => new Date(ms - new Date(ms).getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
let snoozeFor = null;
function openSnooze(p) {
  if (!p) return;
  snoozeFor = p;
  $('#snooze-title').textContent = t('snoozeTitle', `${repoName(p)} #${p.number}`);
  const opt = (key, until, label, hint) => `<button type="button" class="opt" data-until="${until}"><kbd>${key}</kbd><span>${esc(label)}</span><b>${esc(hint)}</b></button>`;
  const day = ms => new Date(ms).toDateString() === new Date().toDateString() ? hhmm(ms) : new Date(ms).toLocaleDateString(LANG, {weekday: 'short', day: 'numeric', month: 'short'});
  $('#snooze-opts').innerHTML = Object.entries(SNOOZE_OPTS).map(([k, f], i) => { const ms = f(); return opt(i + 1, ms, t('sz_' + k), day(ms)); }).join('')
    + (p.snoozedUntil ? opt('u', '', t('unsnooze'), t('untilAt', untilText(Date.parse(p.snoozedUntil)))) : '');
  const at = $('#snooze-at');
  at.min = localInput(Date.now());
  at.value = localInput(at9(1));
  $('#snooze').showModal();
}
async function snooze(p, ms) {
  const rows = visibleRows(), i = rows.findIndex(r => r.dataset.id === S.sel), next = ms && (rows[i + 1] || rows[i - 1])?.dataset.id;
  const what = `${repoName(p)} #${p.number}`;
  try {
    apply(await save('/api/snooze', {key: keyOf(p), until: ms ? new Date(ms).toISOString().replace(/\.\d+Z$/, 'Z') : null}));
    toast(ms ? t('snoozedTil', esc(what), esc(untilText(ms))) : t('unsnoozed', esc(what)));
    // why: the snoozed row is gone; keep the keyboard flow on its neighbour.
    const el = next && $(`.pr[data-id="${CSS.escape(next)}"]`);
    if (el) select(el);
  } catch (e) { toast(`${t('snoozeFail')} <code>${esc(e.message)}</code>`); }
}
$('#snooze-opts').addEventListener('click', e => {
  const b = e.target.closest('[data-until]');
  if (!b) return;
  $('#snooze').close();
  snooze(snoozeFor, Number(b.dataset.until) || null);
});
$('#snooze-form').addEventListener('submit', e => {
  e.preventDefault();
  const ms = new Date($('#snooze-at').value).getTime();
  if (!(ms > Date.now())) return;
  $('#snooze').close();
  snooze(snoozeFor, ms);
});
$('#snooze').addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  const b = e.key === 'u' ? $('#snooze-opts [data-until=""]') : /^[1-4]$/.test(e.key) ? $(`#snooze-opts .opt:nth-child(${e.key})`) : null;
  if (b) { e.preventDefault(); b.click(); }
});
$('#snooze').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

/* selection + keys */
const visibleRows = () => [...document.querySelectorAll('.pr')].filter(r => r.offsetParent !== null);
function select(rowEl, focus = true) {
  if (!rowEl) return;
  document.querySelectorAll('.pr.sel').forEach(r => r.classList.remove('sel'));
  rowEl.classList.add('sel');
  S.sel = rowEl.dataset.id;
  if (focus) { rowEl.querySelector('.t')?.focus({preventScroll: true}); rowEl.scrollIntoView({block: 'nearest'}); }
}
function move(step) {
  const rows = visibleRows();
  if (!rows.length) return;
  const i = rows.findIndex(r => r.dataset.id === S.sel);
  select(rows[i < 0 ? 0 : Math.min(rows.length - 1, Math.max(0, i + step))]);
}
function jumpSection(step) {
  const secs = [...document.querySelectorAll('details.sec')].filter(s => s.querySelector('.pr'));
  if (!secs.length) return;
  const i = secs.indexOf(current()?.closest('details.sec'));
  const next = secs[i < 0 ? (step > 0 ? 0 : secs.length - 1) : Math.min(secs.length - 1, Math.max(0, i + step))];
  next.open = true;
  select(next.querySelector('.pr'));
  next.scrollIntoView({block: 'start'});
}
const current = () => S.sel ? $(`.pr[data-id="${CSS.escape(S.sel)}"]`) : null;

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const inField = e.target.matches?.('input, textarea, select');
  if (inField) {
    if (e.target.type !== 'search') return;
    if (e.key === 'Escape') { if (e.target.value) { e.preventDefault(); e.target.value = ''; e.target.dispatchEvent(new Event('input')); } else e.target.blur(); }
    else if (e.key === 'Enter' && e.target.id === 'q') { e.preventDefault(); e.target.blur(); move(0); }
    return;
  }
  if ($('#help').open || $('#snooze').open || document.querySelector(':popover-open')) return;
  const k = e.key, r = current(), p = r && prOf(r);
  if (k === 'j' || k === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (k === 'k' || k === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (k === 'o' || (k === 'Enter' && !e.target.closest?.('a, button, summary'))) { if (r) { e.preventDefault(); r.querySelector('.t')?.click(); } }
  else if (k === '[' || k === ']') jumpSection(k === ']' ? 1 : -1);
  else if (k === 'x') markSeen(r);
  else if (k === 's') { if (p) { e.preventDefault(); openSnooze(p); } }
  else if (k === 'a') copyPrompt(p, r);
  else if (k === 'y') { if (p) copy(p.md, t('asText', `${repoName(p)} #${p.number}`)); }
  else if (k === 'Y') copyAll();
  else if (k === 'c') { if (r) r.dataset.ref ? copy(shq(r.dataset.ref)) : toast(t('noBranch')); }
  else if (k === 'g') { if (p) copy(checkoutCmd(p)); }
  else if (k === '/') { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  else if (k === 'r') load(true);
  else if (k === 't') toggleTheme();
  else if (k === 'l') toggleLang();
  else if (k === 'p') { if (S.data) { e.preventDefault(); $('#repos').togglePopover(); } }
  else if (k === '?') $('#help').showModal();
  else if (k === 'Escape') { if (S.q) setQuery(''); else { document.querySelectorAll('.pr.sel').forEach(x => x.classList.remove('sel')); S.sel = null; document.activeElement?.blur(); } }
});

let qTimer;
function setQuery(v) {
  S.q = v.trim();
  $('#q').value = v;
  if (S.data) render();
}
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => setQuery(e.target.value), 80); });

document.addEventListener('click', e => {
  const el = e.target;
  const link = el.closest('.pr a.t');
  if (link) { markSeen(link.closest('.pr')); select(link.closest('.pr'), false); return; }
  const a = el.closest('.pr [data-act]');
  if (a) {
    const r = a.closest('.pr'), p = prOf(r);
    select(r, false);
    if (a.dataset.act === 'snooze') openSnooze(p);
    else if (a.dataset.act === 'unsnooze') snooze(p, null);
    else copyPrompt(p, r);
    return;
  }
  const cs = el.closest('[data-copy-sec]');
  if (cs) {
    e.preventDefault();
    const sec = sectionsOf(S.data).find(s => s.id === cs.dataset.copySec);
    copy(sectionText(sec) + filterNote() + '\n', t('asText', sec.title));
    return;
  }
  const nav = el.closest('.nav a');
  if (nav) { const d = $(`#sec-${CSS.escape(nav.dataset.sec)}`); if (d?.tagName === 'DETAILS' && !d.open) d.open = true; }
  if (el.closest('[data-action="retry"]')) load(true);
  const ct = el.closest('[data-copy-text]');
  if (ct) copy(ct.dataset.copyText);
});
document.addEventListener('toggle', e => {
  const id = e.target.dataset?.sec;
  if (!id) return;
  // why: a folded-by-default section (snoozed) stores being opened, the rest store being closed.
  !e.target.open !== e.target.hasAttribute('data-collapsed') ? S.closed.add(id) : S.closed.delete(id);
  store.set('closed', [...S.closed]);
}, true);
$('#copy-all').addEventListener('click', copyAll);
$('#refresh').addEventListener('click', () => load(true));
$('#theme').addEventListener('click', toggleTheme);
$('#lang').addEventListener('click', toggleLang);
$('#notify').addEventListener('click', toggleNotify);
$('#help-btn').addEventListener('click', () => $('#help').showModal());
$('#help-link').addEventListener('click', () => $('#help').showModal());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTools);

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - S.lastLoad > FOCUS_MIN_GAP_MS) load();
});
addEventListener('focus', () => { if (Date.now() - S.lastLoad > FOCUS_MIN_GAP_MS) load(); });

for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
for (const el of document.querySelectorAll('[data-i18n-attr]')) for (const pair of el.dataset.i18nAttr.split(',')) { const [a, k] = pair.split(':'); el.setAttribute(a, t(k)); }
$('#keys').innerHTML = [['j k', 'move'], ['[ ]', 'sections'], ['o Enter', 'open'], ['x', 'seen'], ['s', 'snooze'], ['y', 'copy'], ['Y', 'copyAll'], ['c', 'branch'], ['g', 'checkout'], ['a', 'prompt'], ['/', 'filter'],
  ['p', 'repos'], ['r', 'refresh'], ['t', 'theme'], ['l', 'lang'], ['Esc', 'esc'], ['?', 'help']]
  .map(([keys, k]) => `<dt>${keys.split(' ').map(x => `<kbd>${esc(x)}</kbd>`).join('')}</dt><dd>${t('k_' + k)}</dd>`).join('');
$('#curl').textContent = `curl -s ${location.host}/inbox.md`;
paintTools();
// why: paint the last snapshot instantly; a stale server cache costs 2-5s of gh calls on every F5.
const snap = store.get('snap', null);
if (snap?.login) { S.data = snap; S.cached = true; render(); }
load();
// why: keep polling in background tabs, that's when desktop notifications matter, but slower: a forgotten tab
// shouldn't spend the GitHub quota at the pace of one being read. Showing the tab again loads at once.
setInterval(() => { if (!document.hidden || Date.now() - S.lastLoad >= HIDDEN_REFRESH_MS) load(); }, REFRESH_MS);
setInterval(tick, 20_000);
</script>
</body>
</html>
