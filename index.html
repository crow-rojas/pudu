<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Pudú</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" id="favicon">
<script>
  // why: set the theme before first paint so a dark-mode user never sees a white flash.
  try { const t = JSON.parse(localStorage.getItem('pudu.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root{
  --bg:#F6F6F7; --surface:#FFFFFF; --surface-2:#F1F1F3; --ink:#18181B; --muted:#5F5F69; --faint:#6B6B75;
  --line:#E4E4E7; --line-2:#EFEFF1;
  --accent:#3E63DD; --accent-ink:#FFFFFF; --ok:#1F8A4C; --bad:#CD3B32; --warn:#A35F00; --merged:#7E4CC4;
  --hover:color-mix(in srgb,var(--ink) 3.5%,transparent);
  --sel:color-mix(in srgb,var(--accent) 8%,var(--surface));
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --cols:8px 22px minmax(0,1fr) 148px 70px 30px 24px 44px 40px 90px 66px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161618; --surface:#1C1C1F; --surface-2:#252529; --ink:#EDEDEF; --muted:#A1A1AA; --faint:#909099;
    --line:#2D2D32; --line-2:#252529;
    --accent:#7B9BFF; --accent-ink:#0E1430; --ok:#46C37B; --bad:#F0716A; --warn:#E5A640; --merged:#B794F4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161618; --surface:#1C1C1F; --surface-2:#252529; --ink:#EDEDEF; --muted:#A1A1AA; --faint:#909099;
  --line:#2D2D32; --line-2:#252529;
  --accent:#7B9BFF; --accent-ink:#0E1430; --ok:#46C37B; --bad:#F0716A; --warn:#E5A640; --merged:#B794F4;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.4 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
.i{width:16px;height:16px;flex:none}
kbd{font:600 11px/1 var(--mono);padding:2px 5px;border-radius:4px;border:1px solid var(--line);border-bottom-width:2px;background:var(--surface);color:var(--muted)}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;height:48px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;flex:none;width:224px;font-weight:650;font-size:15px}
.brand img{width:24px;height:24px;border-radius:6px}
.loading .brand img{animation:spin 1.2s linear infinite}
.search{position:relative;flex:1;max-width:460px}
.search .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;width:14px;height:14px}
.search input{width:100%;height:30px;padding:0 36px 0 30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--accent)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.search input:focus + kbd,.search input:not(:placeholder-shown) + kbd{display:none}
.tools{display:flex;align-items:center;gap:2px;margin-left:auto}
.ib{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib[aria-pressed="true"]{color:var(--accent)}
.loading #refresh .i{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:550;color:var(--muted);white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--faint)}
.btn .i{width:14px;height:14px}
.me{width:26px;height:26px;border-radius:50%;margin-left:6px;background:var(--surface-2)}
.me:not([src]){display:none}

/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);gap:16px;padding:12px 16px 32px}
.side{position:sticky;top:60px;align-self:start}
.nav{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.nav a{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:7px;text-decoration:none;color:var(--muted)}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a span{flex:1}
.nav a b{font-weight:550;font-size:12px;font-variant-numeric:tabular-nums;color:var(--faint)}
.nav a.hot{color:var(--ink)}
.nav a.hot b{min-width:20px;text-align:center;padding:2px 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.nav .gap{height:1px;margin:6px 10px;background:var(--line)}

/* repo picker + banner */
.pop{position:fixed;inset:52px 16px auto auto;margin:0;width:320px;max-width:calc(100vw - 32px);max-height:min(70vh,560px);overflow:auto;padding:6px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);box-shadow:0 20px 50px -12px rgba(0,0,0,.4)}
.pop-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 8px;font-size:12px;color:var(--faint)}
.pop-h button{white-space:nowrap;border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0}
.repo-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer}
.repo-opt:hover{background:var(--hover)}
.repo-opt input{accent-color:var(--accent);margin:0}
.repo-opt span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo-opt em{font-style:normal;color:var(--faint)}
.repo-opt b{font-weight:500;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
#repos-btn[data-filtered]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.banner{display:flex;gap:8px;align-items:flex-start;margin:0 0 10px;padding:8px 12px;border-radius:8px;font-size:13px;
  background:color-mix(in srgb,var(--warn) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner .i{color:var(--warn)}
.banner code{font:12px var(--mono);word-break:break-word}
.banner details{display:inline}
.banner summary{display:inline;cursor:pointer;color:var(--muted)}
.banner details[open] code{display:block;margin-top:4px}
.es{max-width:560px;margin:40px auto;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.es img{display:block;border-radius:8px}
.es h2{margin:14px 0 6px;font-size:18px;font-weight:650}
.es p{margin:0 0 14px;color:var(--muted)}
.es p code{font:12.5px var(--mono);color:var(--ink)}
.es a{color:var(--accent)}
.cmd{display:flex;align-items:center;gap:10px;margin:0 0 8px;padding:3px 3px 3px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.cmd span{min-width:96px;color:var(--muted);font-size:12px}
.cmd code{flex:1;font:13px var(--mono);white-space:nowrap;overflow-x:auto}
.es details{margin:0 0 14px}
.es summary{cursor:pointer;color:var(--muted)}
.es pre{margin:8px 0 0;padding:10px;max-height:220px;overflow:auto;border-radius:8px;background:var(--surface-2);font:12px var(--mono);white-space:pre-wrap;word-break:break-word}

/* sections */
.sec{margin:0 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:8px;height:42px;padding:0 10px 0 12px;list-style:none;cursor:pointer;user-select:none}
.sec-h::-webkit-details-marker{display:none}
.sec-h h2{margin:0;font-size:14px;font-weight:600}
.sec-h .n{color:var(--faint);font-variant-numeric:tabular-nums}
.sec-h .hint{color:var(--faint);font-size:12px;margin-left:4px}
.sec-h .btn{margin-left:auto}
.chev{color:var(--faint);transition:transform .15s;width:14px;height:14px}
details.sec[open] .chev{transform:rotate(90deg)}
div.sec .sec-h{cursor:default}
div.sec .chev{visibility:hidden}

/* table */
.row{display:grid;grid-template-columns:var(--cols);gap:8px;align-items:center;padding:0 14px 0 10px}
.cols{height:30px;border-top:1px solid var(--line);color:var(--faint);font-size:12px}
.cols .i{width:14px;height:14px}
.cols .r{text-align:right}
.cols :is(.c-ci,.c-dec,.c-mrg){text-align:center}
.pr{position:relative;min-height:48px;border-top:1px solid var(--line-2);scroll-margin:60px 0 16px}
.pr:hover{background:var(--hover)}
.pr.sel{background:var(--sel);box-shadow:inset 2px 0 0 var(--accent)}
.pr:has(.t:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.z{position:relative;z-index:1}
.new{display:block;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.av{position:relative;flex:none;width:22px;height:22px}
.av img,.av .ini{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);object-fit:cover}
.av .ini{font:650 10px/1 var(--font);color:var(--muted);text-transform:uppercase}
.body{min-width:0;padding:6px 0}
.t{display:block;font-weight:500;font-size:14px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t:focus-visible{outline:none}
.t::after{content:"";position:absolute;inset:0}
.t:hover{text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.meta{display:flex;align-items:center;gap:6px;margin-top:1px;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden}
.meta .sep{color:var(--faint)}
.meta .num{flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .repo{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;font-size:11.5px;background:var(--surface-2);color:var(--muted);flex:none}
.tag .i{width:12px;height:12px}
.tag code{font:11px var(--mono);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.lbl i{width:7px;height:7px;border-radius:50%;background:var(--lc,var(--faint))}
.people{display:flex;justify-content:flex-end;padding-left:6px}
.people .av{margin-left:-6px}
.people .av img,.people .av .ini{border:2px solid var(--surface)}
.pr:hover .people .av img,.pr:hover .people .av .ini{border-color:color-mix(in srgb,var(--ink) 3.5%,var(--surface))}
.pr.sel .people .av img,.pr.sel .people .av .ini{border-color:var(--sel)}
.av.team .ini{border-radius:6px}
.av.pend img,.av.pend .ini{opacity:.5}
.av s{position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--surface);border:1.5px solid var(--surface);text-decoration:none}
.av s .i{width:7px;height:7px;stroke-width:4}
.more{font-size:11px;color:var(--faint);margin-left:4px;align-self:center}
.thr{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thr .i{width:13px;height:13px}
/* why: secondary glyphs stay unfilled so the one filled pill per row carries the verdict. */
.st{display:grid;place-items:center;height:24px;color:var(--c);text-decoration:none}
.st .i{width:16px;height:16px}
.pill{position:relative;display:inline-flex;align-items:center;gap:6px;max-width:100%;height:22px;padding:0 9px 0 8px;border-radius:999px;font-size:12px;font-weight:550;white-space:nowrap;
  color:color-mix(in srgb,var(--c) 78%,var(--ink));background:color-mix(in srgb,var(--c) 13%,transparent)}
.pill::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--c)}
.pill b{min-width:0;font-weight:inherit;overflow:hidden;text-overflow:ellipsis}
.size{display:grid;grid-template-columns:1fr 40px;gap:4px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.add{color:var(--ok)}.del{color:var(--bad)}.size .zero{color:var(--faint)}
[data-tip]:is(:hover,:focus-visible){z-index:3}
[data-tip]:is(:hover,:focus-visible)::after{content:attr(data-tip);position:absolute;right:0;bottom:calc(100% + 6px);width:max-content;max-width:300px;padding:5px 8px;border-radius:6px;
  background:var(--ink);color:var(--bg);font:500 12px/1.35 var(--font);text-align:left;white-space:normal;pointer-events:none}
.c-pill [data-tip]::after{right:auto;left:0}
.when{text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.when.w1{color:var(--warn)}.when.w2{color:var(--bad);font-weight:600}
.empty{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted)}
.sk{height:48px;border-top:1px solid var(--line-2);background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface));background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* footer, dialog, toast */
.foot{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:12px 16px 24px;color:var(--faint);font-size:12px;border-top:1px solid var(--line)}
.foot .warn-t{color:var(--warn)}
.foot code{font:11.5px var(--mono)}
.foot button{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);margin-left:auto;font-size:12px}
.foot button:hover{color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px 22px;width:min(440px,calc(100vw - 32px));box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
dialog h2 img{width:22px;height:22px;border-radius:6px}
dialog dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;align-items:center}
dialog dt{display:flex;gap:4px;justify-content:flex-end}
dialog dd{margin:0;color:var(--muted)}
dialog form{margin-top:16px;text-align:right}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:13px;transition:.2s ease;z-index:60;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast code{font:12px var(--mono)}

/* responsive: secondary columns drop first; the pill and the age always stay */
@media (max-width:1280px){
  :root{--cols:8px 22px minmax(0,1fr) 148px 24px 44px 40px 90px 66px}
  .c-people,.c-thr{display:none!important}
}
@media (max-width:1100px){
  :root{--cols:8px 22px minmax(0,1fr) 148px 90px 66px}
  .c-ci,.c-dec,.c-mrg{display:none!important}
}
@media (max-width:1000px){
  .top{gap:10px}
  .brand{width:auto}.brand span{display:none}
  .shell{grid-template-columns:minmax(0,1fr);padding:8px 10px 24px}
  .side{position:static;overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
  .nav{display:flex;width:max-content;padding-right:32px}
  .nav .gap{display:none}
}
@media (max-width:800px){
  :root{--cols:8px 22px minmax(0,1fr) 140px 66px}
  .c-size{display:none!important}
  .search kbd,#copy-all span,#repos-btn span{display:none}
  .sec-h .hint{display:none}
}
@media (max-width:640px){
  .cols,.c-av{display:none!important}
  .pr{grid-template-columns:8px minmax(0,1fr) auto auto;grid-template-areas:"new t t time" "new meta pill pill";row-gap:3px;padding-block:8px}
  .pr .meta .lbl{display:none}
  .pr .body{display:contents}
  .pr .c-new{grid-area:new;align-self:start;margin-top:7px}
  .pr .t{grid-area:t}
  .pr .meta{grid-area:meta;margin:0}
  .pr .c-pill{grid-area:pill;justify-self:end;max-width:170px}
  .pr .c-time{grid-area:time}
}
@media (max-width:500px){
  .top{flex-wrap:wrap;height:auto;padding-block:8px;row-gap:8px}
  .search{order:9;flex-basis:100%;max-width:none}
  html{scroll-padding-top:100px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip"></a>
<header class="top">
  <a class="brand" href="/" data-i18n-attr="aria-label:home"><img src="/favicon.svg" alt="" width="24" height="24"><span>Pudú</span></a>
  <label class="search">
    <span class="sr" data-i18n="filter"></span>
    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" data-i18n-attr="placeholder:filter,title:filterTip" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
  </label>
  <div class="tools">
    <button class="btn" id="repos-btn" type="button" popovertarget="repos" data-i18n-attr="title:reposTip" hidden></button>
    <button class="btn" id="copy-all" type="button" data-i18n-attr="title:copyAllTip" hidden></button>
    <button class="ib" id="refresh" type="button" data-i18n-attr="aria-label:refreshTip,title:refreshTip"></button>
    <button class="ib" id="notify" type="button" aria-pressed="false"></button>
    <button class="ib" id="theme" type="button" data-i18n-attr="aria-label:themeTip,title:themeTip"></button>
    <button class="ib" id="help-btn" type="button" data-i18n-attr="aria-label:helpTip,title:helpTip"></button>
    <img class="me" id="me" alt="" width="26" height="26" referrerpolicy="no-referrer">
  </div>
</header>

<div class="shell">
  <nav class="side" data-i18n-attr="aria-label:sections"><ul class="nav" id="nav"></ul></nav>
  <main id="main">
    <div id="banner" class="banner" role="status" hidden></div>
    <div id="app" aria-busy="true">
      <div class="sec" aria-hidden="true"><div class="sec-h"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    </div>
  </main>
</div>

<footer class="foot">
  <span id="fresh" data-i18n="connecting"></span>
  <span id="rate"></span>
  <span><span data-i18n="forClaude"></span> <code id="curl"></code></span>
  <button type="button" id="help-link"><span data-i18n="shortcuts"></span> <kbd>?</kbd></button>
</footer>

<dialog id="help" aria-labelledby="help-title">
  <h2 id="help-title"><img src="/favicon.svg" alt=""><span data-i18n="shortcuts"></span></h2>
  <dl id="keys"></dl>
  <form method="dialog"><button class="btn" autofocus data-i18n="done"></button></form>
</dialog>
<div class="pop" id="repos" popover data-i18n-attr="aria-label:reposTip">
  <div class="pop-h"><span data-i18n="hiddenNote"></span><button type="button" data-show-all data-i18n="showAll"></button></div>
  <div id="repo-list"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const REFRESH_MS = 60_000;
const FOCUS_MIN_GAP_MS = 15_000;
const $ = s => document.querySelector(s);

// why: one table per language; English is the fallback for any key a translation misses.
const T = {
  en: {
    skip: 'Skip to content', home: 'Pudú, home', filter: 'Filter PRs', filterTip: 'Searches title, repo, author, number, branch and labels',
    reposTip: 'Choose which repos to show', copyAllTip: 'Copy everything visible as text (Y)', refreshTip: 'Refresh now (r)',
    themeTip: 'Toggle theme (t)', helpTip: 'Keyboard shortcuts (?)', sections: 'Sections', connecting: 'Connecting to GitHub…',
    forClaude: 'For Claude:', shortcuts: 'Keyboard shortcuts', done: 'Done', hiddenNote: "Hidden repos don't count or notify.", showAll: 'Show all',
    s_review: 'Needs your review', s_returned: 'Needs your attention', s_approved: 'Approved', s_waiting: 'Waiting for review',
    s_draft: 'Drafts', s_merged: 'Merged this week', s_bots: 'Bots',

function ago(iso) {

  if (!ms) return '';
  const s = (ms - Date.now()) / 1000, a = Math.abs(s);

  if (a < 3600) return rtf.format(Math.round(s / 60), 'minute');
  if (a < 86400) return rtf.format(Math.round(s / 3600), 'hour');
  return rtf.format(Math.round(s / 86400), 'day');
}
function short(iso) {
  const m = (Date.now() - Date.parse(iso)) / 6e4;
  if (!(m >= 0)) return ['', 0];
  const h = m / 60, urgency = h < 24 ? 0 : h < 72 ? 1 : 2;
  if (m < 1) return [t('now'), 0];
  if (m < 60) return [dur(m, 'minute'), 0];
  if (h < 24) return [dur(h, 'hour'), 0];
  if (h < 24 * 30) return [dur(h / 24, 'day'), urgency];
  if (h < 24 * 365) return [dur(h / 24 / 30, 'month', 'long'), urgency];
  return [dur(h / 24 / 365, 'year', 'long'), urgency];
}

/* render */
function render() {

let baseIcon = null;
const iconImg = new Image();
iconImg.onload = () => { baseIcon = iconImg; renderChrome(); };

function setFavicon(n) {
  const link = $('#favicon');
  if (!baseIcon || !n) { if (link.getAttribute('href') !== '/favicon.svg') link.href = '/favicon.svg'; return; }
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  x.drawImage(baseIcon, 0, 0, 64, 64);
  const label = n > 9 ? '9+' : String(n);
  x.beginPath(); x.arc(41, 23, 23, 0, Math.PI * 2); x.fillStyle = '#fff'; x.fill();
  x.beginPath(); x.arc(41, 23, 19.5, 0, Math.PI * 2); x.fillStyle = '#D42F3B'; x.fill();
  x.fillStyle = '#fff'; x.font = `800 ${label.length > 1 ? 24 : 30}px system-ui, sans-serif`;
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(label, 41, 25);

/* data */
function notifyNew(prev, next) {
  if (!prev || !S.notify || !('Notification' in window) || Notification.permission !== 'granted') return;
  for (const id of NOTIFY_ON) {
    const title = t('n_' + id);
    const get = SECTIONS.find(s => s.id === id).get;
    const before = new Set(arr(get(prev)).map(keyOf));
    for (const p of arr(get(next))) {
      if (before.has(keyOf(p))) continue;
      try {
        const n = new Notification(title, {body: `${repoName(p)}#${p.number}  ${p.title || ''}`, icon: '/favicon.svg', tag: keyOf(p)});
        n.onclick = () => { if (safeUrl(p.url)) window.open(p.url, '_blank', 'noopener'); n.close(); };
      } catch {}
    }
  }
}
function syncSeen(d) {
  const keys = SECTIONS.flatMap(s => arr(s.get(d))).filter(Boolean).map(keyOf);
  if (!S.seenSeeded) { keys.forEach(k => S.seen.add(k)); S.seenSeeded = true; }
  // why: a snapshot flagged with error may be partial; pruning against it would re-mark PRs as new.
  // why: a hidden repo's PRs are absent, not gone; keep them seen so unhiding doesn't flag them as new.
  else if (!d.error) {
    const hidden = new Set(arr(d.repos).filter(r => r.hidden).map(r => r.repo));
    S.seen = new Set([...S.seen].filter(k => keys.includes(k) || hidden.has(k.slice(0, k.lastIndexOf('#')))));
  }
  store.set('seen', [...S.seen]);
}
async function load(force = false) {
  if (S.loading) return;
  S.loading = true;
  document.body.classList.add('loading');
  clearTimeout(S.retryTimer);
  try {
    const r = await fetch(`/api/data?lang=${LANG}${force ? '&force=1' : ''}`, {cache: 'no-store'});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    S.netError = null;
    const kind = T.en['b_' + d?.errorKind] ? d.errorKind : 'other';
    S.err = d?.error ? {kind, msg: d.error, resetAt: d.rateLimit?.resetAt} : null;
    if (!d || !d.login) {
      if (S.data) renderChrome(); else renderNoData();
      S.retryTimer = setTimeout(load, 5000);
      return;
    }
    // why: a snapshot from the last visit is not a previous poll; diffing against it would notify on every F5.
    if (S.data && !S.cached && S.data.fetchedAt !== d.fetchedAt) notifyNew(S.data, d);
    syncSeen(d);
    S.data = d;
    S.cached = false;
    store.set('snap', d);
    render();
    if (force) toast(t('upToDate'));
  } catch (e) {
    S.netError = e.message || t('netErr');
    if (S.data) renderChrome(); else renderNoData();
  } finally {
    S.loading = false;
    S.lastLoad = Date.now();
    document.body.classList.remove('loading');
  }
}

/* selection + keys */
const visibleRows = () => [...document.querySelectorAll('.pr')].filter(r => r.offsetParent !== null);
function select(rowEl, focus = true) {
  if (!rowEl) return;
  document.querySelectorAll('.pr.sel').forEach(r => r.classList.remove('sel'));
  rowEl.classList.add('sel');
  S.sel = rowEl.dataset.id;
  if (focus) { rowEl.querySelector('.t')?.focus({preventScroll: true}); rowEl.scrollIntoView({block: 'nearest'}); }
}
function move(step) {
  const rows = visibleRows();
  if (!rows.length) return;
  const i = rows.findIndex(r => r.dataset.id === S.sel);
  select(rows[i < 0 ? 0 : Math.min(rows.length - 1, Math.max(0, i + step))]);
}
const current = () => S.sel ? $(`.pr[data-id="${CSS.escape(S.sel)}"]`) : null;

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const inField = e.target.matches?.('input, textarea, select');
  if (inField) {
    if (e.key === 'Escape') { if (e.target.value) { e.target.value = ''; setQuery(''); } else e.target.blur(); }
    else if (e.key === 'Enter' && e.target.id === 'q') { e.preventDefault(); e.target.blur(); move(0); }
    return;
  }
  if ($('#help').open) return;
  const k = e.key, r = current(), p = r && prOf(r);
  if (k === 'j' || k === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (k === 'k' || k === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (k === 'o' || (k === 'Enter' && !e.target.closest?.('a, button, summary'))) { if (r) { e.preventDefault(); r.querySelector('.t')?.click(); } }
  else if (k === 'y') { if (p) copy(p.md, t('asText', `${repoName(p)} #${p.number}`)); }
  else if (k === 'Y') copyAll();
  else if (k === 'c') { if (r) r.dataset.ref ? copy(r.dataset.ref) : toast(t('noBranch')); }
  else if (k === 'g') { if (p) copy(`gh pr checkout ${p.number} -R ${p.repo}`); }
  else if (k === '/') { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  else if (k === 'r') load(true);
  else if (k === 't') toggleTheme();
  else if (k === '?') $('#help').showModal();
  else if (k === 'Escape') { if (S.q) setQuery(''); else { document.querySelectorAll('.pr.sel').forEach(x => x.classList.remove('sel')); S.sel = null; document.activeElement?.blur(); } }
});

});
addEventListener('focus', () => { if (Date.now() - S.lastLoad > FOCUS_MIN_GAP_MS) load(); });

for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
for (const el of document.querySelectorAll('[data-i18n-attr]')) for (const pair of el.dataset.i18nAttr.split(',')) { const [a, k] = pair.split(':'); el.setAttribute(a, t(k)); }
$('#keys').innerHTML = [['j k', 'move'], ['o Enter', 'open'], ['y', 'copy'], ['Y', 'copyAll'], ['c', 'branch'], ['g', 'checkout'], ['/', 'filter'],
  ['r', 'refresh'], ['t', 'theme'], ['Esc', 'esc'], ['?', 'help']]
  .map(([keys, k]) => `<dt>${keys.split(' ').map(x => `<kbd>${esc(x)}</kbd>`).join('')}</dt><dd>${t('k_' + k)}</dd>`).join('');
$('#curl').textContent = `curl -s ${location.host}/inbox.md`;
paintTools();
// why: paint the last snapshot instantly; a stale server cache costs 2-5s of gh calls on every F5.
const snap = store.get('snap', null);
if (snap?.login) { S.data = snap; S.cached = true; render(); }
load();
// why: keep polling in background tabs; that's when desktop notifications matter.
setInterval(load, REFRESH_MS);
setInterval(tick, 20_000);
</script>
</body>
</html>
